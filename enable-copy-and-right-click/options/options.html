<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n="optionsTitle">Automatic Sites | Enable Copy and Right Click</title>

    <link rel="stylesheet" href="options.css">
</head>

<body>
    <main>
        <header>
            <p class="extension-name">Enable Copy and Right Click</p>

            <a href="https://github.com/himanshu-mahendra-jain/web-extensions" target="_blank"
                rel="noopener noreferrer" aria-label="GitHub repository, opens in a new tab"
                data-i18n-aria-label="githubLink">
                GitHub
            </a>
        </header>

        <h1 data-i18n="automaticSitesHeading">Automatic Sites</h1>

        <p class="intro" data-i18n="automaticSitesIntro">
            Automatically enable copying, text selection, and right click
            on the websites you add.
        </p>

        <form id="site-form">
            <label class="visually-hidden" for="site-input" data-i18n="siteInputLabel">
                Website domain
            </label>

            <input id="site-input" type="text" placeholder="example.com" autocomplete="off" autocapitalize="none"
                spellcheck="false" inputmode="url" aria-describedby="message" required>

            <button type="submit" data-i18n="addSite">Add Site</button>
        </form>

        <p id="message" role="status"></p>

        <p id="empty-state" class="empty-state" hidden data-i18n="noSites">No automatic sites added yet.</p>

        <ul id="site-list" aria-label="Automatic sites" data-i18n-aria-label="siteListLabel"></ul>
    </main>

    <script type="module" src="options.js"></script>
</body>

</html>
